<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>Instagram Post UI</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: #fafafa;
    font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
    display: flex;
    justify-content: center;
    padding: 40px 12px;
  }

  .post {
    width: 400px;
    background: #fff;
    border: 1px solid #dbdbdb;
    border-radius: 8px;
    overflow: hidden;
  }

  /* Header */
  .post-header {
    display: flex;
    align-items: center;
    padding: 10px 12px;
  }
  .avatar {
    width: 34px;
    height: 34px;
    border-radius: 50%;
    background: linear-gradient(45deg, #feda75, #fa7e1e, #d62976, #962fbf, #4f5bd5);
    padding: 2px;
    flex-shrink: 0;
  }
  .avatar-inner {
    width: 100%;
    height: 100%;
    border-radius: 50%;
    background: #fff url('https://scontent-icn2-1.cdninstagram.com/v/t51.2885-19/445581757_2662596933918801_7000806808101094378_n.jpg?stp=dst-jpg_s150x150_tt6&_nc_cat=108&ccb=7-5&_nc_sid=f7ccc5&efg=eyJ2ZW5jb2RlX3RhZyI6InByb2ZpbGVfcGljLnd3dy4xMDAwLkMzIn0%3D&_nc_ohc=8yfNcBdG940Q7kNvwEaJ8xp&_nc_oc=AdrAFWYm53Uhj7bqrOeCJSO5xCVuR4GVjN2tKOp9nkF0dZCdPIhtlJkluDVqLcoNs50&_nc_zt=24&_nc_ht=scontent-icn2-1.cdninstagram.com&_nc_ss=7b6a8&oh=00_AQAphQON8FoTHX9DsZvT4SSRonRbT3iAwVSBc2CJhkD5_A&oe=6A6A63EE') center/cover;
    border: 2px solid #fff;
  }
  .user-meta {
    margin-left: 10px;
    line-height: 1.15;
  }
  .username {
    font-size: 14px;
    font-weight: 600;
    color: #262626;
  }
  .location {
    font-size: 12px;
    color: #8e8e8e;
  }
  .more-btn {
    margin-left: auto;
    cursor: pointer;
    padding: 4px;
  }
  .more-btn svg { display: block; }

  /* Media (video) */
  .post-media {
    position: relative;
    width: 100%;
    aspect-ratio: 3 / 4;
    background: #000;
    overflow: hidden;
    cursor: grab;
  }
  .post-media.dragging { cursor: grabbing; }
  .bg-video {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 100%;
    height: 100%;
    object-fit: cover;
    transform: translate(-50%, -50%) scale(1);
    transform-origin: center center;
    user-select: none;
    -webkit-user-drag: none;
    pointer-events: none;
  }

  /* Actions */
  .actions {
    display: flex;
    align-items: center;
    padding: 8px 10px 0;
  }
  .actions-left {
    display: flex;
    gap: 14px;
  }
  .actions button {
    background: none;
    border: none;
    padding: 4px;
    cursor: pointer;
    line-height: 0;
  }
  .icon { width: 24px; height: 24px; stroke: #262626; fill: none; stroke-width: 1.8; }
  .save-btn { margin-left: auto; }

  .heart.liked { stroke: #ed4956; fill: #ed4956; }

  /* Likes */
  .likes {
    padding: 6px 12px 0;
    font-size: 14px;
    font-weight: 600;
    color: #262626;
  }

  /* Caption */
  .caption {
    padding: 6px 12px 0;
    font-size: 14px;
    color: #262626;
    line-height: 1.4;
  }
  .caption .username { font-weight: 600; margin-right: 4px; }
  .caption .username { display: inline; }

  .hashtags { color: #00376b; text-decoration: none; }

  .comments-link {
    display: block;
    padding: 6px 12px 0;
    font-size: 13.5px;
    color: #8e8e8e;
    cursor: pointer;
  }

  .timestamp {
    padding: 6px 12px 0;
    font-size: 10px;
    letter-spacing: 0.2px;
    color: #8e8e8e;
    text-transform: uppercase;
  }

  /* Add comment row */
  .add-comment {
    display: flex;
    align-items: center;
    padding: 10px 12px 14px;
    border-top: 1px solid #efefef;
    margin-top: 8px;
  }
  .add-comment input {
    flex: 1;
    border: none;
    outline: none;
    font-size: 14px;
    color: #262626;
  }
  .add-comment input::placeholder { color: #8e8e8e; }
  .post-comment-btn {
    background: none;
    border: none;
    color: #00376b;
    font-weight: 600;
    font-size: 14px;
    opacity: 0.3;
    cursor: default;
  }

  /* Chrome / Edge 영상 호환 처리 */
  .video-retry-btn {
    position: absolute;
    z-index: 5;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    min-width: 116px;
    min-height: 44px;
    padding: 10px 18px;
    border: 0;
    border-radius: 999px;
    background: rgba(0, 0, 0, 0.72);
    color: #fff;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
  }

  .video-retry-btn[hidden] {
    display: none;
  }

  .video-status {
    position: absolute;
    z-index: 4;
    left: 12px;
    right: 12px;
    bottom: 14px;
    padding: 9px 12px;
    border-radius: 999px;
    background: rgba(0, 0, 0, 0.66);
    color: #fff;
    font-size: 12px;
    font-weight: 600;
    text-align: center;
    pointer-events: none;
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
  }

  .video-status[hidden] {
    display: none;
  }

</style>
</head>
<body>

<div class="post">

  <div class="post-header">
    <div class="avatar"><div class="avatar-inner"></div></div>
    <div class="user-meta">
      <div class="username">cafe_creamzip</div>
      <div class="location">광주, 대한민국</div>
    </div>
    <div class="more-btn">
      <svg class="icon" viewBox="0 0 24 24"><circle cx="12" cy="5" r="1.2" stroke-width="1" fill="#262626"/><circle cx="12" cy="12" r="1.2" stroke-width="1" fill="#262626"/><circle cx="12" cy="19" r="1.2" stroke-width="1" fill="#262626"/></svg>
    </div>
  </div>

  <div class="post-media" id="postMedia">
    <video
      class="bg-video"
      id="bgVideo"
      autoplay
      muted
      loop
      playsinline
      preload="auto"
      aria-label="크림집 테라스 애니메이션"
    ></video>

    <button class="video-retry-btn" id="videoRetryBtn" type="button" hidden>
      영상 재생
    </button>

    <div class="video-status" id="videoStatus" hidden>
      영상을 불러오는 중입니다.
    </div>
  </div>

  <div class="actions">
    <div class="actions-left">
      <button aria-label="좋아요" onclick="toggleLike(this)">
        <svg class="icon heart" viewBox="0 0 24 24"><path d="M12 21s-7.5-4.7-10-9.3C0.3 8.1 2 4 6 4c2.2 0 3.8 1.3 6 3.5C14.2 5.3 15.8 4 18 4c4 0 5.7 4.1 4 7.7C19.5 16.3 12 21 12 21z"/></svg>
      </button>
      <button aria-label="댓글">
        <svg class="icon" viewBox="0 0 24 24"><path d="M20.5 12c0 4.4-3.8 8-8.5 8-1.2 0-2.4-.2-3.4-.7L3.5 20.5l1.3-4.8C4.3 14.6 3.5 13.4 3.5 12c0-4.4 3.8-8 8.5-8s8.5 3.6 8.5 8z"/></svg>
      </button>
      <button aria-label="공유">
        <svg class="icon" viewBox="0 0 24 24"><line x1="22" y1="2" x2="9.2" y2="14.8"/><polygon points="22 2 15.2 22 9.2 14.8 2 9 22 2"/></svg>
      </button>
    </div>
    <button class="save-btn" aria-label="저장">
      <svg class="icon" viewBox="0 0 24 24"><path d="M6 3h12v18l-6-4.5L6 21z"/></svg>
    </button>
  </div>

  <div class="caption">
    <a class="hashtags" href="https://www.instagram.com/explore/tags/%EB%93%9C%EB%A1%9C%EC%9E%89/" target="_blank" rel="noopener">#드로잉</a> <a class="hashtags" href="https://www.instagram.com/explore/tags/%EC%95%A0%EB%8B%88%EB%A9%94%EC%9D%B4%EC%85%98/" target="_blank" rel="noopener">#애니메이션</a> <a class="hashtags" href="https://www.instagram.com/explore/tags/%EB%A7%88%EC%BC%80%ED%8C%85/" target="_blank" rel="noopener">#마케팅</a>
  </div>

  <div class="timestamp">2시간 전</div>

  <div class="add-comment">
    <input type="text" placeholder="댓글 달기...">
    <button class="post-comment-btn">게시</button>
  </div>

</div>

<script>
  function toggleLike(btn) {
    btn.querySelector('.heart').classList.toggle('liked');
  }

  const video = document.getElementById('bgVideo');
  const wrap = document.getElementById('postMedia');
  const retryButton = document.getElementById('videoRetryBtn');
  const videoStatus = document.getElementById('videoStatus');

  /*
    브라우저나 CDN 상태에 따라 첫 주소가 실패할 수 있으므로
    동일한 MP4 파일의 공개 주소를 순서대로 시도합니다.
  */
  const videoSources = [
    'https://raw.githubusercontent.com/seoyeon0119/Portfolio/03e8d400d5fa8a25eb7982e71967044ba172c54a/%ED%81%AC%EB%A6%BC%EC%A7%91%20%ED%85%8C%EB%9D%BC%EC%8A%A4%20%EB%B0%B0%EA%B2%BD.mp4',
    'https://cdn.jsdelivr.net/gh/seoyeon0119/Portfolio@03e8d400d5fa8a25eb7982e71967044ba172c54a/%ED%81%AC%EB%A6%BC%EC%A7%91%20%ED%85%8C%EB%9D%BC%EC%8A%A4%20%EB%B0%B0%EA%B2%BD.mp4',
    'https://github.com/seoyeon0119/Portfolio/raw/03e8d400d5fa8a25eb7982e71967044ba172c54a/%ED%81%AC%EB%A6%BC%EC%A7%91%20%ED%85%8C%EB%9D%BC%EC%8A%A4%20%EB%B0%B0%EA%B2%BD.mp4'
  ];

  let sourceIndex = 0;
  let sourceChangeTimer = null;
  let hasStarted = false;

  function setStatus(message) {
    videoStatus.textContent = message;
    videoStatus.hidden = !message;
  }

  function setSource(index) {
    sourceIndex = index;
    hasStarted = false;

    clearTimeout(sourceChangeTimer);
    setStatus('영상을 불러오는 중입니다.');
    retryButton.hidden = true;

    video.pause();
    video.removeAttribute('src');
    video.load();

    video.src = videoSources[index];
    video.load();

    /*
      서버가 오류를 즉시 반환하지 않고 멈추는 경우도 있어서,
      8초 안에 재생 준비가 되지 않으면 다음 주소를 시도합니다.
    */
    sourceChangeTimer = setTimeout(() => {
      if (!hasStarted) tryNextSource();
    }, 8000);
  }

  async function startVideo() {
    try {
      video.muted = true;
      video.defaultMuted = true;
      video.loop = true;
      video.playsInline = true;

      await video.play();

      hasStarted = true;
      clearTimeout(sourceChangeTimer);
      setStatus('');
      retryButton.hidden = true;
      return true;
    } catch (error) {
      console.warn('영상 자동재생 실패:', error);
      retryButton.hidden = false;
      retryButton.textContent = '영상 재생';
      setStatus('');
      return false;
    }
  }

  function tryNextSource() {
    clearTimeout(sourceChangeTimer);

    if (sourceIndex < videoSources.length - 1) {
      setSource(sourceIndex + 1);
      return;
    }

    setStatus('영상을 재생하지 못했습니다. 파일을 H.264 MP4로 변환해 주세요.');
    retryButton.hidden = false;
    retryButton.textContent = '다시 시도';
  }

  video.addEventListener('loadedmetadata', startVideo);
  video.addEventListener('canplay', startVideo);

  video.addEventListener('playing', () => {
    hasStarted = true;
    clearTimeout(sourceChangeTimer);
    setStatus('');
    retryButton.hidden = true;
  });

  video.addEventListener('waiting', () => {
    if (!hasStarted) setStatus('영상을 불러오는 중입니다.');
  });

  video.addEventListener('stalled', () => {
    if (!hasStarted) tryNextSource();
  });

  video.addEventListener('error', () => {
    const mediaError = video.error;
    console.warn('영상 오류:', mediaError ? mediaError.code : '알 수 없음');
    tryNextSource();
  });

  retryButton.addEventListener('click', async (event) => {
    event.stopPropagation();

    const started = await startVideo();
    if (!started && sourceIndex === videoSources.length - 1) {
      sourceIndex = 0;
      setSource(0);
    }
  });

  /*
    Chrome과 Edge 모두 무음 영상은 자동재생할 수 있지만,
    노션 iframe 또는 브라우저 설정에 따라 사용자 동작이 필요할 수 있습니다.
  */
  document.addEventListener('pointerdown', function firstInteraction(event) {
    if (event.target.closest('a')) return;
    startVideo();
  }, { once: true });

  document.addEventListener('visibilitychange', () => {
    if (!document.hidden && video.paused) {
      startVideo();
    }
  });

  /* 영상 위치/크기 조절: 드래그 이동, 휠 확대·축소 */
  (function () {
    let scale = 1;
    let offsetX = 0;
    let offsetY = 0;
    let dragging = false;
    let startX = 0;
    let startY = 0;

    function apply() {
      video.style.transform =
        `translate(calc(-50% + ${offsetX}px), calc(-50% + ${offsetY}px)) scale(${scale})`;
    }

    wrap.addEventListener('mousedown', (event) => {
      if (event.target.closest('button')) return;

      dragging = true;
      startX = event.clientX - offsetX;
      startY = event.clientY - offsetY;
      wrap.classList.add('dragging');
    });

    window.addEventListener('mousemove', (event) => {
      if (!dragging) return;

      offsetX = event.clientX - startX;
      offsetY = event.clientY - startY;
      apply();
    });

    window.addEventListener('mouseup', () => {
      dragging = false;
      wrap.classList.remove('dragging');
    });

    wrap.addEventListener('touchstart', (event) => {
      if (event.target.closest('button')) return;

      const touch = event.touches[0];
      dragging = true;
      startX = touch.clientX - offsetX;
      startY = touch.clientY - offsetY;
    }, { passive: true });

    wrap.addEventListener('touchmove', (event) => {
      if (!dragging) return;

      const touch = event.touches[0];
      offsetX = touch.clientX - startX;
      offsetY = touch.clientY - startY;
      apply();
    }, { passive: true });

    wrap.addEventListener('touchend', () => {
      dragging = false;
    });

    wrap.addEventListener('wheel', (event) => {
      event.preventDefault();

      scale += -event.deltaY * 0.0015;
      scale = Math.min(3, Math.max(0.5, scale));
      apply();
    }, { passive: false });
  })();

  setSource(0);
</script>

</body>
</html>
