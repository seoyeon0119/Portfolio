<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>Instagram Post UI</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: #fafafa;
    font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
    display: flex;
    justify-content: center;
    padding: 40px 12px;
  }

  .post {
    width: 400px;
    background: #fff;
    border: 1px solid #dbdbdb;
    border-radius: 8px;
    overflow: hidden;
  }

  /* Header */
  .post-header { display: flex; align-items: center; padding: 10px 12px; }
  .avatar {
    width: 34px; height: 34px; border-radius: 50%;
    background: linear-gradient(45deg, #feda75, #fa7e1e, #d62976, #962fbf, #4f5bd5);
    padding: 2px; flex-shrink: 0;
  }
  .avatar-inner {
    width: 100%; height: 100%; border-radius: 50%;
    background: #fff url('https://scontent-icn2-1.cdninstagram.com/v/t51.2885-19/445581757_2662596933918801_7000806808101094378_n.jpg?stp=dst-jpg_s150x150_tt6&_nc_cat=108&ccb=7-5&_nc_sid=f7ccc5&efg=eyJ2ZW5jb2RlX3RhZyI6InByb2ZpbGVfcGljLnd3dy4xMDAwLkMzIn0%3D&_nc_ohc=8yfNcBdG940Q7kNvwEaJ8xp&_nc_oc=AdrAFWYm53Uhj7bqrOeCJSO5xCVuR4GVjN2tKOp9nkF0dZCdPIhtlJkluDVqLcoNs50&_nc_zt=24&_nc_ht=scontent-icn2-1.cdninstagram.com&_nc_ss=7b6a8&oh=00_AQAphQON8FoTHX9DsZvT4SSRonRbT3iAwVSBc2CJhkD5_A&oe=6A6A63EE') center/cover;
    border: 2px solid #fff;
  }
  .user-meta { margin-left: 10px; line-height: 1.15; }
  .username { font-size: 14px; font-weight: 600; color: #262626; }
  .location { font-size: 12px; color: #8e8e8e; }
  .more-btn { margin-left: auto; cursor: pointer; padding: 4px; }
  .more-btn svg { display: block; }

  /* Image */
  .post-image {
    width: 100%;
    aspect-ratio: 4 / 5;
    object-fit: cover;
    display: block;
    background: #efefef;
  }

  /* Actions */
  .actions { display: flex; align-items: center; padding: 8px 10px 0; }
  .actions-left { display: flex; gap: 14px; }
  .actions button { background: none; border: none; padding: 4px; cursor: pointer; line-height: 0; }
  .icon { width: 24px; height: 24px; stroke: #262626; fill: none; stroke-width: 1.8; }
  .save-btn { margin-left: auto; }
  .heart.liked { stroke: #ed4956; fill: #ed4956; }

  /* Caption */
  .caption { padding: 6px 12px 0; font-size: 14px; color: #262626; line-height: 1.4; }
  .hashtags { color: #00376b; text-decoration: none; }

  .timestamp { padding: 6px 12px 0; font-size: 10px; letter-spacing: 0.2px; color: #8e8e8e; text-transform: uppercase; }

  /* Add comment row */
  .add-comment { display: flex; align-items: center; padding: 10px 12px 14px; border-top: 1px solid #efefef; margin-top: 8px; }
  .add-comment input { flex: 1; border: none; outline: none; font-size: 14px; color: #262626; }
  .add-comment input::placeholder { color: #8e8e8e; }
  .post-comment-btn { background: none; border: none; color: #00376b; font-weight: 600; font-size: 14px; opacity: 0.3; cursor: default; }
</style>
</head>
