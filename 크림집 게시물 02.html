<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>Instagram Post UI</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: #fafafa;
    font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
    display: flex;
    justify-content: center;
    padding: 40px 12px;
  }

  .post {
    width: 400px;
    background: #fff;
    border: 1px solid #dbdbdb;
    border-radius: 8px;
    overflow: hidden;
  }

  /* Header */
  .post-header {
    display: flex;
    align-items: center;
    padding: 10px 12px;
  }
  .avatar {
    width: 34px;
    height: 34px;
    border-radius: 50%;
    background: linear-gradient(45deg, #feda75, #fa7e1e, #d62976, #962fbf, #4f5bd5);
    padding: 2px;
    flex-shrink: 0;
  }
  .avatar-inner {
    width: 100%;
    height: 100%;
    border-radius: 50%;
    background: #fff url('https://scontent-icn2-1.cdninstagram.com/v/t51.2885-19/445581757_2662596933918801_7000806808101094378_n.jpg?stp=dst-jpg_s150x150_tt6&_nc_cat=108&ccb=7-5&_nc_sid=f7ccc5&efg=eyJ2ZW5jb2RlX3RhZyI6InByb2ZpbGVfcGljLnd3dy4xMDAwLkMzIn0%3D&_nc_ohc=8yfNcBdG940Q7kNvwEaJ8xp&_nc_oc=AdrAFWYm53Uhj7bqrOeCJSO5xCVuR4GVjN2tKOp9nkF0dZCdPIhtlJkluDVqLcoNs50&_nc_zt=24&_nc_ht=scontent-icn2-1.cdninstagram.com&_nc_ss=7b6a8&oh=00_AQAphQON8FoTHX9DsZvT4SSRonRbT3iAwVSBc2CJhkD5_A&oe=6A6A63EE') center/cover;
    border: 2px solid #fff;
  }
  .user-meta {
    margin-left: 10px;
    line-height: 1.15;
  }
  .username {
    font-size: 14px;
    font-weight: 600;
    color: #262626;
  }
  .location {
    font-size: 12px;
    color: #8e8e8e;
  }
  .more-btn {
    margin-left: auto;
    cursor: pointer;
    padding: 4px;
  }
  .more-btn svg { display: block; }

  /* Media (video) */
  .post-media {
    position: relative;
    width: 100%;
    aspect-ratio: 3 / 4;
    background: #000;
    overflow: hidden;
    cursor: grab;
  }
  .post-media.dragging { cursor: grabbing; }
  .bg-video {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 100%;
    height: 100%;
    object-fit: cover;
    transform: translate(-50%, -50%) scale(1);
    transform-origin: center center;
    user-select: none;
    -webkit-user-drag: none;
    pointer-events: none;
  }

  /* Actions */
  .actions {
    display: flex;
    align-items: center;
    padding: 8px 10px 0;
  }
  .actions-left {
    display: flex;
    gap: 14px;
  }
  .actions button {
    background: none;
    border: none;
    padding: 4px;
    cursor: pointer;
    line-height: 0;
  }
  .icon { width: 24px; height: 24px; stroke: #262626; fill: none; stroke-width: 1.8; }
  .save-btn { margin-left: auto; }

  .heart.liked { stroke: #ed4956; fill: #ed4956; }

  /* Likes */
  .likes {
    padding: 6px 12px 0;
    font-size: 14px;
    font-weight: 600;
    color: #262626;
  }

  /* Caption */
  .caption {
    padding: 6px 12px 0;
    font-size: 14px;
    color: #262626;
    line-height: 1.4;
  }
  .caption .username { font-weight: 600; margin-right: 4px; }
  .caption .username { display: inline; }

  .hashtags { color: #00376b; text-decoration: none; }

  .comments-link {
    display: block;
    padding: 6px 12px 0;
    font-size: 13.5px;
    color: #8e8e8e;
    cursor: pointer;
  }

  .timestamp {
    padding: 6px 12px 0;
    font-size: 10px;
    letter-spacing: 0.2px;
    color: #8e8e8e;
    text-transform: uppercase;
  }

  /* Add comment row */
  .add-comment {
    display: flex;
    align-items: center;
    padding: 10px 12px 14px;
    border-top: 1px solid #efefef;
    margin-top: 8px;
  }
  .add-comment input {
    flex: 1;
    border: none;
    outline: none;
    font-size: 14px;
    color: #262626;
  }
  .add-comment input::placeholder { color: #8e8e8e; }
  .post-comment-btn {
    background: none;
    border: none;
    color: #00376b;
    font-weight: 600;
    font-size: 14px;
    opacity: 0.3;
    cursor: default;
  }
</style>
</head>
<body>

<div class="post">

  <div class="post-header">
    <div class="avatar"><div class="avatar-inner"></div></div>
    <div class="user-meta">
      <div class="username">cafe_creamzip</div>
      <div class="location">광주, 대한민국</div>
    </div>
    <div class="more-btn">
      <svg class="icon" viewBox="0 0 24 24"><circle cx="12" cy="5" r="1.2" stroke-width="1" fill="#262626"/><circle cx="12" cy="12" r="1.2" stroke-width="1" fill="#262626"/><circle cx="12" cy="19" r="1.2" stroke-width="1" fill="#262626"/></svg>
    </div>
  </div>

  <div class="post-media" id="postMedia">
    <video class="bg-video" id="bgVideo" src="https://cdn.jsdelivr.net/gh/seoyeon0119/Portfolio@03e8d400d5fa8a25eb7982e71967044ba172c54a/%ED%81%AC%EB%A6%BC%EC%A7%91%20%ED%85%8C%EB%9D%BC%EC%8A%A4%20%EB%B0%B0%EA%B2%BD.mp4" autoplay muted loop playsinline></video>
  </div>

  <div class="actions">
    <div class="actions-left">
      <button aria-label="좋아요" onclick="toggleLike(this)">
        <svg class="icon heart" viewBox="0 0 24 24"><path d="M12 21s-7.5-4.7-10-9.3C0.3 8.1 2 4 6 4c2.2 0 3.8 1.3 6 3.5C14.2 5.3 15.8 4 18 4c4 0 5.7 4.1 4 7.7C19.5 16.3 12 21 12 21z"/></svg>
      </button>
      <button aria-label="댓글">
        <svg class="icon" viewBox="0 0 24 24"><path d="M20.5 12c0 4.4-3.8 8-8.5 8-1.2 0-2.4-.2-3.4-.7L3.5 20.5l1.3-4.8C4.3 14.6 3.5 13.4 3.5 12c0-4.4 3.8-8 8.5-8s8.5 3.6 8.5 8z"/></svg>
      </button>
      <button aria-label="공유">
        <svg class="icon" viewBox="0 0 24 24"><line x1="22" y1="2" x2="9.2" y2="14.8"/><polygon points="22 2 15.2 22 9.2 14.8 2 9 22 2"/></svg>
      </button>
    </div>
    <button class="save-btn" aria-label="저장">
      <svg class="icon" viewBox="0 0 24 24"><path d="M6 3h12v18l-6-4.5L6 21z"/></svg>
    </button>
  </div>

  <div class="likes">좋아요 2,141개</div>

  <div class="caption">
    <span class="username">cafe_creamzip</span>내 안의 특별한 Red Flavor 🍉🌿<br>
    뜨거운 태양 아래 가장 생각나는 색, 붉고 찬란한 여름의 맛을 담았어요.<br>
    오늘 하루도 달콤상큼하게 충전해 보세요!<br>
    🍒 체리베리 &amp; 자몽 케이크로 부드럽고 달콤하게<br>
    🧊 체리아이스티, 수박주스, 토마토자몽으로 시원하고 달달하게<br>
    <a class="hashtags" href="https://www.instagram.com/explore/tags/%ED%81%AC%EB%A6%BC%EC%A7%91/" target="_blank" rel="noopener">#크림집</a> <a class="hashtags" href="https://www.instagram.com/explore/tags/%EA%B4%91%EC%A3%BC%EC%BC%80%EC%9D%B4%ED%81%AC/" target="_blank" rel="noopener">#광주케이크</a> <a class="hashtags" href="https://www.instagram.com/explore/tags/%EA%B4%91%EC%A3%BC%EC%B9%B4%ED%8E%98/" target="_blank" rel="noopener">#광주카페</a> <a class="hashtags" href="https://www.instagram.com/explore/tags/%EA%B4%91%EC%A3%BC%EB%94%94%EC%A0%80%ED%8A%B8%EC%B6%94%EC%B2%9C/" target="_blank" rel="noopener">#광주디저트추천</a>
  </div>

  <div class="comments-link">댓글 87개 모두 보기</div>
  <div class="timestamp">2시간 전</div>

  <div class="add-comment">
    <input type="text" placeholder="댓글 달기...">
    <button class="post-comment-btn">게시</button>
  </div>

</div>

<script>
  function toggleLike(btn) {
    btn.querySelector('.heart').classList.toggle('liked');
  }

  // 영상 위치/크기 조절 (드래그로 이동, 휠로 확대/축소) - 버튼 없이 직접 조작
  (function () {
    const wrap = document.getElementById('postMedia');
    const video = document.getElementById('bgVideo');
    let scale = 1, offsetX = 0, offsetY = 0;
    let dragging = false, startX = 0, startY = 0;

    function apply() {
      video.style.transform = `translate(calc(-50% + ${offsetX}px), calc(-50% + ${offsetY}px)) scale(${scale})`;
    }

    wrap.addEventListener('mousedown', (e) => {
      dragging = true;
      startX = e.clientX - offsetX;
      startY = e.clientY - offsetY;
      wrap.classList.add('dragging');
    });
    window.addEventListener('mousemove', (e) => {
      if (!dragging) return;
      offsetX = e.clientX - startX;
      offsetY = e.clientY - startY;
      apply();
    });
    window.addEventListener('mouseup', () => {
      dragging = false;
      wrap.classList.remove('dragging');
    });

    wrap.addEventListener('touchstart', (e) => {
      const t = e.touches[0];
      dragging = true;
      startX = t.clientX - offsetX;
      startY = t.clientY - offsetY;
    }, { passive: true });
    wrap.addEventListener('touchmove', (e) => {
      if (!dragging) return;
      const t = e.touches[0];
      offsetX = t.clientX - startX;
      offsetY = t.clientY - startY;
      apply();
    }, { passive: true });
    wrap.addEventListener('touchend', () => { dragging = false; });

    wrap.addEventListener('wheel', (e) => {
      e.preventDefault();
      scale += -e.deltaY * 0.0015;
      scale = Math.min(3, Math.max(0.5, scale));
      apply();
    }, { passive: false });
  })();
</script>

</body>
</html>
